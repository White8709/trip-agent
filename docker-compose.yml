services:
  trip-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trip-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./backend/.env
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      DATABASE_URL: "sqlite://data/trip_agent.db?mode=rwc"
      AUDIO_CACHE_DIR: "data/audio"
      STATIC_DIR: "/app/frontend/dist"
    volumes:
      - ./data:/app/data
